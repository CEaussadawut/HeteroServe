# Phase 2 isolated-device sweep for the Pi 5, consumed by scripts/10_isolated_bench.sh.
# One cell per line:  <model-local-name>  <n_prompt>  <n_gen>  <threads>
#
# n_prompt drives the compute-bound PREFILL measurement (TTFT);
# n_gen drives the bandwidth-bound DECODE measurement (TPOT).
# The prompt lengths bracket the 256-token point used for the KV-state estimate in
# Appendix A.2.3 so the measured and predicted transfer costs are comparable.
#
# Thread counts 1/2/4 are included on the smallest rung only: the point is to show
# where the A76 stops scaling, not to re-measure it on every model.
qwen2.5-0.5b-q4km   128   64   1
qwen2.5-0.5b-q4km   128   64   2
qwen2.5-0.5b-q4km   128   64   4
qwen2.5-0.5b-q4km   256  128   4
qwen2.5-0.5b-q4km   512  128   4
llama3.2-1b-q4km    128   64   4
llama3.2-1b-q4km    256  128   4
tinyllama-1.1b-q4km 256  128   4
tinyllama-1.1b-q8   256  128   4
qwen2.5-1.5b-q4km   128   64   4
qwen2.5-1.5b-q4km   256  128   4
qwen2.5-1.5b-q4km   512  128   4
qwen2.5-1.5b-q8     256  128   4
llama3.2-3b-q4km    128   64   4
llama3.2-3b-q4km    256  128   4
llama3.2-3b-q4km    512  128   4
# The top rung: 7B Q4_K_M (~4.7 GB) is the largest model that fits the Pi 5 alone.
# It is the distribution baseline -- the reference every split placement is scored
# against -- so it is measured here in isolation before any cluster run.
qwen2.5-7b-q4km     128   64   4
qwen2.5-7b-q4km     256  128   4
