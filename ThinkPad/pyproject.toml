[project]
name = "heteroserve-control"
version = "0.1.0"
description = "HeteroServe control plane: cluster manager, placement engine, harness, energy collector"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]

[project.scripts]
heteroctl = "control.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["control"]
